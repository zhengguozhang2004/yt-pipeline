name: fetch-book

# 云端书籍获取管道
# Actions 运行在 GitHub（境外 IP），可访问国内被墙的 libgen / Anna's / archive.org
# 国内通过 GitHub API 写入任务、读取 artifact 结果

on:
  workflow_dispatch:
    inputs:
      query:
        description: '搜索关键词（书名/作者）'
        required: true
        default: 'Motorcycle Dynamics Cossalter'
      mode:
        description: '模式: search(只搜索) / fetch(搜索并下载)'
        required: true
        default: 'search'
      isbn:
        description: '可选：ISBN 精确检索'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run book fetcher
        env:
          QUERY: ${{ github.event.inputs.query }}
          MODE: ${{ github.event.inputs.mode }}
          ISBN: ${{ github.event.inputs.isbn }}
        run: |
          mkdir -p out
          python scripts/fetch_book.py 2>&1 | tee out/fetch.log
          echo "---- exit: $? ----"

      - name: List results
        if: always()
        run: |
          echo "=== out/ ==="
          ls -la out/ || true
          echo "=== sizes ==="
          du -h out/* 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-result
          path: out/
          retention-days: 7

      - name: Commit report to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp out/fetch.log "results/last-fetch.log" 2>/dev/null || true
          cp out/report.json "results/last-report.json" 2>/dev/null || true
          git add results/ 2>/dev/null || true
          git commit -m "fetch-book report $(date -u +%Y%m%dT%H%M%SZ)" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "push skipped"