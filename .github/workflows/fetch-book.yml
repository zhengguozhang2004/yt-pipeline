name: fetch-book

on:
  workflow_dispatch:
    inputs:
      query:
        description: '搜索关键词'
        required: true
        default: 'Motorcycle Dynamics Cossalter'
      book_id:
        description: 'libgen 记录 ID（可选）'
        required: false
        default: ''
      isbn:
        description: 'ISBN（可选）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run downloader
        env:
          QUERY: ${{ github.event.inputs.query }}
          BOOK_ID: ${{ github.event.inputs.book_id }}
          ISBN: ${{ github.event.inputs.isbn }}
        run: |
          mkdir -p out
          python scripts/fetch_book3.py 2>&1 | tee out/fetch.log
          echo "---- done ----"

      - name: Inspect results
        if: always()
        run: |
          echo "=== out/ ==="
          ls -la out/ || true
          echo "=== file types ==="
          for f in out/*.pdf out/*.epub out/*.djvu; do
            [ -f "$f" ] && file "$f" || true
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-files
          path: out/
          retention-days: 7

      # 关键：把下载到的书以 base64 分片提交到仓库（绕过 artifact 下载需要登录的限制）
      - name: Publish book to repo (base64 chunks)
        if: always()
        run: |
          python - <<'PYEOF'
          import base64, glob, json, os, subprocess, sys

          files = []
          for pat in ("out/*.pdf", "out/*.epub", "out/*.djvu", "out/*.txt"):
              files.extend(glob.glob(pat))

          os.makedirs("results", exist_ok=True)

          meta = {"files": []}
          for fp in files:
              size = os.path.getsize(fp)
              if size < 1000:
                  continue
              name = os.path.basename(fp)
              meta["files"].append({"name": name, "size": size})
              # 分片 base64，每片 4MB
              chunk_size = 4 * 1024 * 1024
              idx = 0
              with open(fp, "rb") as f:
                  while True:
                      chunk = f.read(chunk_size)
                      if not chunk:
                          break
                      b64 = base64.b64encode(chunk).decode("ascii")
                      out = f"results/{name}.part{idx:03d}.b64"
                      with open(out, "w") as g:
                          g.write(b64)
                      print(f"wrote {out} ({len(b64)} chars)")
                      idx += 1
              meta["files"][-1]["parts"] = idx

          with open("results/manifest.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          print("manifest:", json.dumps(meta, indent=2))
          PYEOF

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp out/fetch.log "results/last-fetch.log" 2>/dev/null || true
          cp out/report3.json "results/last-report.json" 2>/dev/null || true
          git add results/ 2>/dev/null || true
          git commit -m "book fetch $(date -u +%Y%m%dT%H%M%SZ)" 2>/dev/null || echo "nothing"
          git push 2>/dev/null || echo "push failed"