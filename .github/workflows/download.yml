name: download-videos
on:
  workflow_dispatch:
    inputs:
      urls:
        description: '视频链接（每行一个）'
        required: true
  push:
    paths:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解析链接
        id: urls
        run: |
          if [ -f downloads/urls.txt ]; then
            URLS=$(grep -v '^#' downloads/urls.txt | grep -v '^$' | tr '\n' '|' | sed 's/|$//')
          else
            URLS=$(echo "${{ github.event.inputs.urls }}" | tr '\n' '|' | sed 's/|$//')
          fi
          echo "URLS=$URLS" >> $GITHUB_OUTPUT
          echo "解析到链接: $URLS"
      - name: 下载视频（yt-dlp 全客户端 → 三通道）
        run: |
          set +e
          pip install -U yt-dlp 2>/dev/null || true
          mkdir -p out
          IFS='|' read -ra ARR <<< "${{ steps.urls.outputs.URLS }}"
          for u in "${ARR[@]}"; do
            [ -z "$u" ] && continue
            echo "==> $u" | tee -a out/download.log
            VID=$(echo "$u" | grep -oP 'v=\K[^&]+' || true)
            DONE=0
            # 通道0: yt-dlp 全客户端尝试
            if echo "$u" | grep -q 'youtube'; then
              BEFORE=$(ls out/*.mp4 2>/dev/null | wc -l)
              for CLIENT in web_creator web_safari mweb tv_embedded android_vr; do
                yt-dlp --no-warnings --extractor-args "youtube:player_client=$CLIENT;youtube:player_skip=webpage,configs" \
                  -f "bestvideo+bestaudio/best" --merge-output-format mp4 \
                  -o "out/%(title).150s.%(ext)s" "$u" 2>&1 | tee -a out/download.log
                AFTER=$(ls out/*.mp4 2>/dev/null | wc -l)
                if [ "$AFTER" -gt "$BEFORE" ]; then
                  echo "[yt-dlp:$CLIENT] 成功" | tee -a out/download.log
                  DONE=1
                  break
                fi
                echo "[yt-dlp:$CLIENT] 失败" | tee -a out/download.log
              done
            fi
            # 通道1: Cobalt API v10（由其服务器处理 YouTube 验证）
            RES=$(curl -s -m 60 -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -X POST -d "{\"url\":\"$u\",\"downloadMode\":\"auto\",\"videoQuality\":\"720\"}" \
              https://api.cobalt.tools/ 2>/dev/null || true)
            DLURL=$(echo "$RES" | jq -r '.url // empty' 2>/dev/null || true)
            if [ -n "$DLURL" ]; then
              NAME=$(echo "$RES" | jq -r '.filename // "video"' 2>/dev/null || true)
              NAME=$(echo "$NAME" | tr '/' '_')
              if curl -s -L -m 600 -o "out/${NAME}.mp4" "$DLURL"; then
                echo "[cobalt] 成功: ${NAME}" | tee -a out/download.log
                DONE=1
              else
                echo "[cobalt] 直链下载失败" | tee -a out/download.log
              fi
            else
              echo "[cobalt] 无结果: $(echo "$RES" | head -c 200)" | tee -a out/download.log
            fi
            # 通道2: Invidious 实例（本地转流）
            if [ "$DONE" != "1" ] && [ -n "$VID" ]; then
              for INST in https://yewtu.be https://inv.nadeko.net https://invidious.nerdvpn.de https://iv.ggtyler.dev https://invidious.f5.si https://inv.us.projectsegfau.lt https://invidious.privacyredirect.com https://iv.melmac.space; do
                DATA=$(curl -s -m 60 "$INST/api/v1/videos/$VID?local=true&fields=videoStreams,title" 2>/dev/null || true)
                TITLE=$(echo "$DATA" | jq -r '.title // empty' 2>/dev/null || true)
                SURL=$(echo "$DATA" | jq -r '[.videoStreams[]?] | sort_by(.bitrate) | last | .url // empty' 2>/dev/null || true)
                TITLE=$(echo "$TITLE" | tr '/' '_')
                if [ -n "$SURL" ] && [ -n "$TITLE" ] && curl -s -L -m 600 -o "out/${TITLE}.mp4" "$SURL"; then
                  echo "[invidious:$INST] 成功: $TITLE" | tee -a out/download.log
                  DONE=1
                  break
                else
                  echo "[invidious:$INST] 不可用" | tee -a out/download.log
                fi
              done
            fi
            # 通道3: Piped API
            if [ "$DONE" != "1" ] && [ -n "$VID" ]; then
              for PIPE in https://pipedapi.kavin.rocks https://api.piped.private.coffee https://pipedapi.adminforge.de https://piapi.ggtyler.dev; do
                DATA=$(curl -s -m 60 "$PIPE/streams/$VID" 2>/dev/null || true)
                TITLE=$(echo "$DATA" | jq -r '.title // empty' 2>/dev/null || true)
                SURL=$(echo "$DATA" | jq -r '[.videoStreams[]?] | sort_by(.bitrate) | last | .url // empty' 2>/dev/null || true)
                TITLE=$(echo "$TITLE" | tr '/' '_')
                if [ -n "$SURL" ] && [ -n "$TITLE" ] && curl -s -L -m 600 -o "out/${TITLE}.mp4" "$SURL"; then
                  echo "[piped:$PIPE] 成功: $TITLE" | tee -a out/download.log
                  DONE=1
                  break
                else
                  echo "[piped:$PIPE] 不可用" | tee -a out/download.log
                fi
              done
            fi
            [ "$DONE" = "1" ] || echo "[FAIL] $u" | tee -a out/download.log
          done
          echo "===== out 目录 ====="
          ls -la out/
          exit 0
      - name: 打包并发布 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip -r videos.zip out/
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest videos.zip --title "视频下载" --notes "自动下载的视频文件"
          echo "下载地址: https://github.com/${{ github.repository }}/releases/download/latest/videos.zip"
